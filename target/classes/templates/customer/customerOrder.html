<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Place an Order</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Place an Order</h2>
        <form th:action="@{/order/placeOrder}" method="post">
            <input type="hidden" name="customerId" th:value="${customerId}"/> <!-- Include customerId -->
            <input type="hidden" name="itemId" th:value="${item.id}"/> <!-- Assuming item ID is available -->
            
            <div class="form-group">
                <label for="vendorId">Vendor ID:</label>
                <input type="number" class="form-control" id="vendorId" name="vendorId" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Place Order</button>
        </form>
    </div>
</body>
</html>
